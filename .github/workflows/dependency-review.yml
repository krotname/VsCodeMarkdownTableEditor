name: Dependency Review

# Pull request only: the action compares the base and head of a pull request, and a
# workflow_dispatch run has no such refs to compare.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Review dependency changes
    if: >-
      github.repository == 'krotname/VsCodeMarkdownTableEditor'
      && github.actor == github.repository_owner
      && github.triggering_actor == github.repository_owner
      && github.event_name == 'pull_request'
      && github.event.pull_request.user.login == github.repository_owner
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNS_ON || '["arc-prod-adler-vscode-mte"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ARC cache contract
        if: startsWith(runner.name, 'arc-prod-adler-')
        shell: bash
        run: /opt/arc-cache/arc-cache check-workflow --file .github/workflows/dependency-review.yml --job "$GITHUB_JOB"
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
