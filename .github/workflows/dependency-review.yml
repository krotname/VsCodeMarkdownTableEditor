name: Dependency Review

# Pull request only: the action compares the base and head of a pull request, and a
# workflow_dispatch run has no such refs to compare.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Review dependency changes
    if: >-
      github.repository == 'krotname/VsCodeMarkdownTableEditor'
      && github.actor == github.repository_owner
      && github.triggering_actor == github.repository_owner
      && github.event_name == 'pull_request'
      && github.event.pull_request.user.login == github.repository_owner
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-prod-adler-vscode-mte
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
