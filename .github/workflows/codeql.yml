name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  actions: read
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: JavaScript/TypeScript
    if: >-
      github.repository == 'krotname/VsCodeMarkdownTableEditor'
      && ((github.event_name == 'pull_request'
           && github.actor == github.repository_owner
      && github.triggering_actor == github.repository_owner
           && github.event.pull_request.user.login == github.repository_owner
           && github.event.pull_request.head.repo.full_name == github.repository)
          || (github.ref == 'refs/heads/main'
              && (github.event_name == 'schedule' || github.actor == github.repository_owner)))
    runs-on: arc-prod-adler-vscode-mte
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ARC cache contract
        if: startsWith(runner.name, 'arc-prod-adler-')
        shell: bash
        run: /opt/arc-cache/arc-cache check-workflow --file .github/workflows/codeql.yml --job "$GITHUB_JOB"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ !startsWith(runner.name, 'arc-prod-adler-') && 'npm' || '' }}
          package-manager-cache: ${{ !startsWith(runner.name, 'arc-prod-adler-') }}
      - run: npm ci
      - run: npm run build
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: never
          upload-database: false
          output: codeql-results
      - name: Fail on CodeQL findings
        run: node scripts/check-sarif.mjs codeql-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: error
          retention-days: 1
