name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run package
      - run: sha256sum build/markdown-table-editor.vsix > build/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: build/markdown-table-editor.vsix
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/markdown-table-editor.vsix build/SHA256SUMS.txt --generate-notes --verify-tag
