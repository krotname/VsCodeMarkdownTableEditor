name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: OSSF Scorecards
    # scorecard-action is a Docker action: enable only after its separate DinD pool is proved.
    if: >-
      vars.CI_DOCKER_SCORECARD_ENABLED == 'true'
      && github.repository == 'krotname/VsCodeMarkdownTableEditor'
      && github.ref == 'refs/heads/main'
      && github.triggering_actor == github.repository_owner
      && (github.event_name == 'schedule' || github.actor == github.repository_owner)
    runs-on: arc-prod-adler-docker-vscode-mte
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
      security-events: write
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check ARC cache contract
        if: startsWith(runner.name, 'arc-prod-adler-')
        shell: bash
        run: /opt/arc-cache/arc-cache check-workflow --file .github/workflows/scorecard.yml --job "$GITHUB_JOB"
      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard-results.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssf-scorecard
          path: scorecard-results.sarif
          if-no-files-found: error
          retention-days: 1
